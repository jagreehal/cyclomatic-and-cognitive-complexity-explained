name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test # the refactoring examples keep their behaviour

      # The README quotes these numbers and reports. If one drifts, the build fails.
      - run: pnpm demo:check
      - run: pnpm examples:check
      - run: pnpm demo:oxlint-baseline
      - run: pnpm demo:ratchet-fail
      - run: pnpm demo:ratchet-pass
