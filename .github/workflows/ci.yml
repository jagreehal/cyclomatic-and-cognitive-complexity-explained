name: ci

on: [push, pull_request]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # The fixtures, examples, and quoted report lines must stay honest, or the README lies.
      - run: pnpm demo:check
      - run: pnpm examples:check
      - run: pnpm demo:oxlint-baseline
      - run: pnpm demo:ratchet-fail
      - run: pnpm demo:ratchet-pass
      - run: shellcheck agent-hooks/claude-code/complexity-check.sh
